name: Run URL tests

on:
  pull_request:
    branches:
      - main


jobs:
  autotests-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Set up dependencies
        run: npm install

      - name: Run only URL tests
        run: npm test -- tests/url-checker.test.ts